name: Deploy Pages

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # 👇 关键：进入子项目
      - name: Install deps
        working-directory: ./apps/web
        run: npm install

      - name: Build
        working-directory: ./apps/web
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./apps/web/dist

      - uses: actions/deploy-pages@v4
